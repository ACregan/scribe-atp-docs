stages:
  - build
  - verify
  - deploy
  - smoke-test

default:
  image: node:22
  tags:
    - SERVER-docker-runner
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  interruptible: true

.build-rules: &build-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.astro"
        - "**/*.mdx"
        - "**/*.md"
        - "**/*.ts"
        - "**/*.mjs"
        - "**/*.json"
        - ".gitlab-ci.yml"

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  <<: *build-rules

# Blocking: validates internal navigation (links between pages, anchors) never
# leaves the network — no dependency on third-party uptime, so it's safe to
# gate merges on.
link-check:internal:
  stage: verify
  needs: ["build"]
  script:
    - npm ci
    - npm run link-check
  <<: *build-rules

# Non-blocking: also checks links out to third-party sites (GitHub, AT
# Protocol spec docs, etc.). Surfaces rot without failing a docs MR over
# someone else's outage.
link-check:external:
  stage: verify
  needs: ["build"]
  allow_failure: true
  script:
    - npm ci
    - npm run link-check:external
  <<: *build-rules

deploy:
  stage: deploy
  interruptible: false
  environment:
    name: production
    url: https://scribe-atp.app
  before_script:
    - command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - printf '\n' >> "$SSH_DEPLOY_KEY"
    - chmod 400 "$SSH_DEPLOY_KEY" && ssh-add "$SSH_DEPLOY_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $VPS_USER@$VPS_HOST "~/server/deploy.sh scribe-atp-docs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

# Runs automatically once the manual deploy job above completes — confirms
# both scribe-atp.app and docs.scribe-atp.app actually came back up with real
# content (not a stale cache, redirect loop, or default nginx page) rather
# than just trusting that the SSH deploy script exited 0.
smoke-test:
  stage: smoke-test
  before_script:
    - command -v curl >/dev/null || ( apt-get update -y && apt-get install -y curl )
  script:
    - bash scripts/smoke-test.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
